name: Build and Release Mod

on:
  workflow_dispatch: # 允许你在 Actions 页面手动点击按钮触发
  push:
    tags:
      - "1.21.6-fix" # 当你推送类似 v1.0.0 的标签时自动触发发布

permissions:
  contents: write # 赋予 Action 创建 Release 的权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Minecraft 1.20.5+ (1.21) 需要 Java 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # 自动处理 Gradle 缓存和 Wrapper
        
      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # 可选：清理不需要的文件 (源码包和开发包)，只保留主模组 Jar
      # 如果你希望发布源码包，可以删除这一步
      - name: Cleanup Artifacts
        run: |
          rm build/libs/*-dev.jar || true
          rm build/libs/*-sources.jar || true
          echo "Listing files to be released:"
          ls -l build/libs/

      # 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # 只有在推送标签时才执行发布
        with:
          files: build/libs/*.jar # 上传 build/libs 下剩余的所有 jar 文件
          generate_release_notes: true # 自动生成更新日志
          make_latest: true
